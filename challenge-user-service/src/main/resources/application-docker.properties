spring.application.name=challenge-user-service

server.port=${CLIENTE_SERVICE_PORT}

eureka.instance.prefer-ip-address=true
eureka.customer.register-with-eureka=true
eureka.customer.fetch-registry=true
eureka.customer.service-url.defaultZone = http://${EUREKA_HOST}:${EUREKA_PORT}/eureka
#eureka.instance.hostname=localhost

spring.datasource.url=jdbc:mysql://${CLIENTE_DB_HOST}:${CLIENTE_DB_PORT}/usuarios-db?createDatabaseIfNotExist=true
#spring.datasource.url=jdbc:mysql://${CLIENTE_DB_HOST}:${CLIENTE_DB_PORT}/usuarios-db
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.cloud.openfeign.customer.config.account.url=http://${GATEWAY_HOST}:${GATEWAY_PORT}

#### KAFKA ####
spring.kafka.producer.bootstrap-servers= kafka:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
