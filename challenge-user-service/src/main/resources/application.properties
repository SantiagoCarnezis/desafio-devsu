spring.application.name=challenge-user-service

server.port=8082

eureka.instance.prefer-ip-address=true
eureka.customer.register-with-eureka=true
eureka.customer.fetch-registry=true
eureka.customer.service-url.defaultZone = http://localhost:8070/eureka
eureka.instance.hostname=localhost

spring.datasource.url=jdbc:mysql://localhost:3306/usuarios-db
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.cloud.openfeign.customer.config.account.url=http://localhost:8090
feign.customer.config.default.retryer=feign.Retryer.Default
feign.customer.config.default.maxAttempts=5
feign.customer.config.default.period=2000
feign.customer.config.default.maxPeriod=5000
spring.cloud.openfeign.customer.config.account.retryer=feign.Retryer.Default


#### KAFKA ####
spring.kafka.producer.bootstrap-servers= localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
