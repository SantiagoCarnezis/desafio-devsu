spring.application.name=challenge-movement-service

server.port=${MOVIMIENTO_SERVICE_PORT}

eureka.instance.prefer-ip-address=true
eureka.customer.register-with-eureka=true
eureka.customer.fetch-registry=true
eureka.customer.service-url.defaultZone = http://${EUREKA_HOST}:${EUREKA_PORT}/eureka
#eureka.instance.hostname=localhost

spring.datasource.url=jdbc:mysql://${MOVIMIENTO_DB_HOST}:${MOVIMIENTO_DB_PORT}/movements-db?createDatabaseIfNotExist=true
#spring.datasource.url=jdbc:mysql://${MOVIMIENTO_DB_HOST}:${MOVIMIENTO_DB_PORT}/movements-db
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

#### KAFKA ####
##spring.kafka.consumer.bootstrap-servers= ${KAFKA_HOST}:${KAFKA_PORT}
spring.kafka.consumer.bootstrap-servers=kafka:9092
spring.kafka.consumer.group-id = challenge-id
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
