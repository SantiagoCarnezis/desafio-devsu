spring.application.name=challenge-api-gateway

server.port=8090

eureka.instance.prefer-ip-address=true
eureka.customer.register-with-eureka=true
eureka.customer.fetch-registry=true
eureka.customer.service-url.defaultZone = http://localhost:8070/eureka
eureka.instance.hostname=localhost


spring.cloud.gateway.routes[0].id=movements_gateway
spring.cloud.gateway.routes[0].uri=http://localhost:8081
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/movements/**
spring.cloud.gateway.routes[0].filters[0]=StripPrefix=1

spring.cloud.gateway.routes[1].id=accounts_gateway
spring.cloud.gateway.routes[1].uri=http://localhost:8081
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/accounts/**
spring.cloud.gateway.routes[1].filters[0]=StripPrefix=1

spring.cloud.gateway.routes[2].id=reports_gateway
spring.cloud.gateway.routes[2].uri=http://localhost:8081
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/reportes/**
spring.cloud.gateway.routes[2].filters[0]=StripPrefix=1

spring.cloud.gateway.routes[3].id=customer_gateway
spring.cloud.gateway.routes[3].uri=http://localhost:8082
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/clientes/**
spring.cloud.gateway.routes[3].filters[0]=StripPrefix=1